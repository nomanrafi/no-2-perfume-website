<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>VELORA — Parfums</title>
  <meta name="description" content="Velora Parfums — discover the collection.">
  <link rel="preload" href="assets/fonts/archivo-italic-var.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <div id="bg" aria-hidden="true">
    <div class="bg-dark"></div>
    <div class="bg-color"></div>
    <div class="bg-flash"></div>
  </div>
  <canvas id="gl" aria-label="Velora fragrance collection, drag to browse"></canvas>

  <!-- fixed UI -->
  <div class="corners" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
  <header class="top">
    <button class="sound" id="sound" aria-label="Sound on/off"><span
        class="bars"><i></i><i></i><i></i><i></i></span><span class="sound-label">ON</span></button>
    <a class="logo" href="#" aria-label="Velora home"><span class="logo-main">VELORA</span><span
        class="logo-sub">PARFUMS</span></a>
    <nav class="nav">
      <button class="menu" id="menuBtn"><span class="dots"><i></i><i></i><i></i><i></i></span>MENU</button>
      <a class="contact" href="#faq">CONTACT</a>
    </nav>
  </header>

  <div class="ring" id="ring" aria-hidden="true">
    <div class="ring-disc"></div>
    <div class="ring-light"></div>
    <div class="ring-beam"></div>
  </div>

  <!-- HERO overlay -->
  <section class="hero-ui" id="heroUI">
    <button class="arrow arrow-l" id="prev" aria-label="Previous">‹</button>
    <button class="arrow arrow-r" id="next" aria-label="Next">›</button>
    <div class="hero-bottom">
      <h1 class="pname" id="pname"><span>NOIR</span><span>ÉCLAT</span></h1>
      <div class="slider" id="slider">
        <div class="slider-line"></div>
        <div class="slider-dot" id="sliderDot"></div>
      </div>
      <p class="hint">SCROLL TO DISCOVER</p>
    </div>
    <div class="glow" id="glow"></div>
  </section>

  <!-- DETAIL overlay (fixed, driven by scroll) -->
  <section class="detail-ui" id="detailUI">
    <div class="intro" id="intro">
      <p class="eyebrow"><span id="dnum">N° 01</span><i></i><span id="dfam">AMBER WOODY</span></p>
      <h2 class="dtitle" id="dtitle"><span>NOIR</span><span>ÉCLAT</span></h2>
      <p class="dtext" id="dtext"></p>
      <ul class="notes" id="dnotes"></ul>
      <dl class="specs" id="dspecs"></dl>
      <div class="dbuy"><span class="price" id="dprice">$165</span><span class="size">EAU DE PARFUM · 100 ML / 3.4 FL.OZ</span></div>
    </div>
    <div class="feats" id="feats"></div>
    <ul class="icons" id="icons"></ul>
    <div class="dline" id="dline"></div>
  </section>

  <div class="statement" id="statement" aria-hidden="true"><span>PURE</span><span>ELEGANCE</span></div>

  <!-- scroll spacer + FAQ -->
  <main id="scroller">
    <div class="spacer" id="spacer"></div>
    <section class="faq" id="faq">
      <h2 class="faq-title"><span>FREQUENTLY</span><span>ASKED QUESTIONS</span></h2>
      <div class="faq-list" id="faqList"></div>
    </section>
    <footer class="foot"><span>© 2026 VELORA PARFUMS</span><span>MADE BY NOMAN-RAFI</span></footer>
  </main>

  <div class="cursor" id="cursor"><span>DRAG</span></div>
  <div class="loader" id="loader"><span class="logo-main">VELORA</span>
    <div class="load-bar"><i id="loadBar"></i></div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>

</html>
